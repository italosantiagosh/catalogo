<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Nove de Julho — Catálogo de Atacado{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="topo-fixo">
    <div class="faixa-topo">
      <span>💰 Desconto progressivo automático — até 65% OFF no atacado</span>
      <span>🚚 Frete grátis acima de R$ 300</span>
    </div>
    <header class="topo">
      <a class="marca" href="{{ url_for('index') }}">
        <span class="marca-nome">Nove de Julho</span>
        <span class="marca-sub">Catálogo de atacado</span>
      </a>
      <a class="link-carrinho" href="{{ url_for('carrinho') }}">
        🛒 Carrinho <span id="contador-carrinho">0</span>
      </a>
    </header>
    <div class="barra-persistente" id="barra-persistente" hidden></div>
  </div>
  <main>
    {% block conteudo %}{% endblock %}
  </main>
  {% if request.endpoint != 'carrinho' %}
    <a class="whatsapp-flutuante" href="https://wa.me/{{ whatsapp_number }}" target="_blank"
       rel="noopener" aria-label="Falar no WhatsApp">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="#fff" aria-hidden="true">
        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
      </svg>
    </a>
  {% endif %}
  <script src="{{ url_for('static', filename='js/carrinho.js') }}"></script>
  {% block script %}{% endblock %}
</body>
</html>
