{% extends "base.html" %}

{% block titulo %}Carrinho — Catálogo de Medalhas{% endblock %}

{% block conteudo %}
  <h1>Seu carrinho</h1>

  <div id="carrinho-vazio" hidden>
    <p class="vazio-texto">Seu carrinho está vazio.</p>
    <a class="botao-secundario" href="{{ url_for('index') }}">Ver catálogo</a>
  </div>

  <div id="lista-itens" class="lista-itens"></div>

  <div class="resumo-carrinho" id="resumo-carrinho" hidden>
    <p class="resumo-linha">Quantidade total: <strong id="resumo-quantidade">0</strong> peças</p>

    <div id="progresso-grupos"></div>

    <p class="resumo-linha resumo-subtotal">Subtotal: <strong id="resumo-subtotal">R$ 0,00</strong></p>

    <div class="progresso-bloco">
      <p class="progresso-texto" id="progresso-frete-texto"></p>
      <div class="barra-progresso">
        <div class="barra-progresso-preenchimento barra-progresso-frete" id="progresso-frete-preenchimento"></div>
      </div>
    </div>

    <p class="aviso-minimo" id="aviso-minimo" hidden></p>

    <p class="pedido-id" id="pedido-id-texto"></p>

    <div class="whatsapp-acoes">
      <button type="button" id="btn-whatsapp-finalizar" class="botao-whatsapp">
        Finalizar pedido pelo WhatsApp
      </button>
      <button type="button" id="btn-whatsapp-duvida" class="botao-whatsapp-secundario">
        Tirar uma dúvida sobre este carrinho
      </button>
    </div>

    <div class="resumo-acoes">
      <button type="button" id="btn-limpar" class="botao-secundario">Limpar carrinho</button>
      <a class="botao-secundario" href="{{ url_for('index') }}">Continuar comprando</a>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
{% endblock %}

{% block script %}
  <script>window.WHATSAPP_NUMBER = {{ whatsapp_number | tojson }};</script>
  <script src="{{ url_for('static', filename='js/carrinho_pagina.js') }}"></script>
{% endblock %}
