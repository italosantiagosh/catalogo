services:
  - type: web
    name: catalogo-medalhas
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # --max-requests volta pro valor original (1000/100): a correcao de
    # verdade pra fragmentacao de memoria e´ o MALLOC_ARENA_MAX abaixo,
    # que ataca a causa raiz -- reciclar o worker com mais frequencia
    # (300/50, testado antes) era so uma segunda camada de protecao,
    # mas com --workers 1 cada reciclagem tem uma janela real de
    # lentidao (o processo novo precisa reimportar o app inteiro --
    # reportlab, PIL, boto3, apscheduler -- antes de aceitar
    # requisicoes de novo). Ver conversa: PageSpeed mostrou LCP/TBT
    # piorando bem depois dessa mudanca, mesmo com a pagina objetivamente
    # mais leve -- nao da pra provar que foi essa a causa, mas o
    # beneficio marginal dela (com o MALLOC_ARENA_MAX ja cobrindo a
    # causa raiz) nao compensa o risco de lentidao periodica.
    startCommand: gunicorn app:app --timeout 90 --workers 1 --worker-class gthread --threads 8 --max-requests 1000 --max-requests-jitter 100
    envVars:
      # Limita quantas "arenas" de memoria o glibc pode abrir por
      # processo -- por padrao, malloc abre uma arena por thread ativa
      # (ate 8x o normal de 1 processo aqui, ver --threads acima), e
      # memoria liberada por uma arena nem sempre fica disponivel pras
      # outras, o que e´ exatamente o padrao de "memoria so´ cresce,
      # nunca cai" que causou quedas reais no Render (ver conversa).
      # Correcao padrao/documentada pra esse sintoma em apps Python
      # threaded -- sem mudanca de codigo nenhuma.
      - key: MALLOC_ARENA_MAX
        value: "2"
    disk:
      name: catalogo-dados
      mountPath: /var/data
      sizeGB: 1
